name: DineGo CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Lint & Unit Tests
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Backend Lint, Typecheck & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter & Typecheck
        run: npm run lint

      - name: Run Backend Unit Tests (Vitest)
        run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ci_test_jwt_access_secret_key_32_characters_long
          JWT_REFRESH_SECRET: ci_test_jwt_refresh_secret_key_32_characters_long
          MOMO_ENABLE_SANDBOX_FALLBACK: true

      - name: Build Backend (NestJS compilation)
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Lint & Production Build
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Frontend Build (Vite + TypeScript)
        run: npm run build

